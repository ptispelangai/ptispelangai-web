<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempahan Bilik Mesyuarat PKG Pelangai</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
    }
    .main-wrapper {
      max-width: 900px;

    /* STIL DASHBOARD JADUAL (TEMA BIRU KORPORAT FORMAL) */

      padding: 20px;
      margin-bottom: 25px;

    }
    .dashboard-container h3 {
      text-align: center;

    }
    table {

    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;

      vertical-align: middle;
    }
    th {
      background-color: #0056b3;

    }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .status-cell {

    }
    .badge-lulus {
      background-color: #28a745;

    /* BUTANG CETAK MINI DALAM LAJUR STATUS */

    /* STIL BUTANG PAGINATION */

    }
    .pagination-btn {

    .pagination-btn:hover {

    #pageInfo {

    }

    /* STIL BORANG TEMPAHAN */
    .form-container { 
      background: #ffffff; 
      padding: 25px; 
      border-radius: 8px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      border-top: 5px solid #0056b3; 
    }
    h2 { 
      text-align: center; 
      color: #0056b3; 
      margin-bottom: 20px; 
    }
    .form-group { margin-bottom: 15px; }
    label { 
      display: block; 
      font-weight: bold;

      color: #333; 
    }
    input, select, textarea {

      border: 1px solid #ccc;

      box-sizing: border-box;

    }
    button[type="submit"] { 
      width: 100%; 
      padding: 12px; 
      background-color: #0056b3; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      font-size: 16px; 
      cursor: pointer;

    }
    button[type="submit"]:hover { background-color: #003d80; }

    /* REKA BENTUK SLIP CETAKAN REKOD A4 (PRINT ONLY) */

    /* MODAL PAPARAN PRATONTON SEBELUM CETAK */

      display: none;
      position: fixed;

    .preview-modal-content {

    /* KAWALAN CETAKAN STRICT 1 PAGE A4 */
    @media print {
      @page { 
        size: A4 portrait;

        width: 100% !important;
        height: 100% !important;

      #reportArea, .main-wrapper, .preview-actions, .preview-modal, .preview-modal-content {

        position: absolute !important;

        box-shadow: none !important;

      #previewModalContent {
        position: relative !important;

        word-break: break-word !important;

      }
    }

    /* GAYA TAB PILIHAN B */
    .tab-nav-wrapper {

      gap: 5px;
      margin-bottom: -1px;
    }
    .main-tab-btn {
      padding: 10px 18px;
      background: #e2e8f0;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-bottom: none;
      border-radius: 6px 6px 0 0;

    }
    .main-tab-btn.active {

      border-bottom: 1px solid #ffffff;
    }

    /* KAD STATUS HARI INI DI DALAM TAB */
    .today-status-card {
      padding: 12px 15px;
      background-color: #f0fdf4;
      border-left: 5px solid #28a745;
      border-radius: 4px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
    }
    .today-status-card.occupied {
      background-color: #fef2f2;
      border-left-color: #dc3545;
    }

 /* POPUP TAKWIM / KALENDAR (SEIMBANG KIRI & KANAN) */
    .cal-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(3px);
      z-index: 99999;
      padding: 15px;
      overflow-y: auto;
      box-sizing: border-box; /* Kunci padding supaya tidak tolak ke tepi */
    }
    .cal-modal-content {
      background: #ffffff;
      width: 100%;             /* Fleksibel ikut skrin */
      max-width: 580px;        /* Saiz ideal supaya tidak terlebih lebar */
      margin: 25px auto;       /* 'auto' akan letak tepat di tengah */
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      box-sizing: border-box; /* Pastikan ruang kiri kanan sama rata */
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 6px;
    }
    .cal-btn-nav {
      background: #0056b3;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .cal-col-name {
      font-weight: bold;
      background: #f1f5f9;
      padding: 6px 1px;
      font-size: 11.5px;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    /* KOTAK TARIKH KALENDAR YANG RAPI & SERAGAM */
    .cal-cell {
      height: 52px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 3px;
      font-size: 12px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .cal-cell.today {
      border: 2px solid #0056b3;
      background: #eff6ff;
    }
    .cal-cell.has-booking {
      background-color: #fee2e2;
      border: 1.5px solid #ef4444;
      cursor: pointer;
    }
    .cal-cell.has-booking:hover {
      background-color: #fecaca;
      transform: scale(1.04);
    }
    .cal-dot {
      width: 7px;
      height: 7px;
      background-color: #dc2626;
      border-radius: 50%;
      margin-top: 6px;
    }

/* OPTIMASI KHUSUS TAMPILAN PONSEL / MOBILE (LAYAR <= 600px) */
    @media screen and (max-width: 600px) {
      body {
        padding: 10px 8px; /* Kurangi jarak tepi layar ponsel */

      .tab-nav-wrapper {

        border-radius: 6px;
        padding: 10px;
      }
      .cal-modal-content {
        padding: 12px;
        margin: 15px auto;
        width: 95%; /* Kalender memanfaatkan lebar layar ponsel penuh */
      }
      .cal-cell {
        height: 42px; /* Sedikit lebih ramping di layar sentuh ponsel */
        font-size: 11px;
      }
      .cal-col-name {
        font-size: 10.5px;
        padding: 4px 1px;
      }
      .today-status-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }

  </style>

</head>
<body>
<div class="main-wrapper">
<!-- TAB BAR PILIHAN B -->
  <div class="tab-nav-wrapper">
    <button type="button" class="main-tab-btn active" id="tabUtama">📌 Status Penggunaan & Jadual</button>
    <button type="button" class="main-tab-btn" onclick="openCalendarModal()">📅 Takwim / Kalendar</button>
  </div>

  <!-- KONTENA UTAMA ATAS -->
  <div class="dashboard-container" style="border-radius: 0 8px 8px 8px; border-top: 3px solid #0056b3;">
    
    <!-- KAD STATUS RINGKAS HARI INI -->
    <div id="todayStatusBox" class="today-status-card">
      <span id="todayStatusText">🟢 Memeriksa status hari ini...</span>
      <span id="todayDateLabel" style="font-weight: bold; color: #555;"></span>
    </div>

    <h3 style="font-size: 15px; margin-bottom: 10px;">📌 REKOD TEMPAHAN BILIK MESYUARAT PKG PELANGAI TERKINI</h3>
    
    <div style="overflow-x:auto;">
      <table id="jadualTempahan">
        <thead>
          <tr>
            <th style="width: 15%;">Tarikh</th>
            <th style="width: 20%;">Masa</th>
            <th style="width: 25%;">Sekolah / Agensi</th>
            <th style="width: 20%;">Tujuan / Program</th>
            <th style="width: 20%;">Status</th>
          </tr>
        </thead>
        <tbody id="jadualBody">
          <tr><td colspan="5" class="loading-text">Memuatkan data tempahan terkini...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- KAWALAN PAGINATION -->
    <div class="pagination-container">
      <button id="btnPrev" class="pagination-btn" onclick="prevPage()" disabled>◀ Sebelum</button>
      <span id="pageInfo">Halaman 1</span>
      <button id="btnNext" class="pagination-btn" onclick="nextPage()" disabled>Seterusnya ▶</button>
    </div>
  </div>


  <!-- BAHAGIAN 2: BORANG TEMPAHAN -->
  <div class="form-container">
    <h2>Permohonan Tempahan Bilik Mesyuarat PKG Pelangai</h2>
    
    <form id="bookingForm">
      <div class="form-group">
        <label for="nama">Nama Pemohon:</label>
        <input type="text" id="nama" required placeholder="Contoh: Cikgu Ahmad Bin Ali">
      </div>

      <div class="form-group">
        <label for="sekolah">Sekolah / Agensi:</label>
        <select id="sekolah" required>
          <option value="">-- PILIH SEKOLAH / AGENSI --</option>
          <option value="SK FELDA SG. KEMAHAL">SK FELDA SG. KEMAHAL</option>
          <option value="SK FELDA CHEMOMOI">SK FELDA CHEMOMOI</option>
          <option value="SMK FELDA CHEMOMOI">SMK FELDA CHEMOMOI</option>
          <option value="SK FELDA KEMASUL">SK FELDA KEMASUL</option>
          <option value="SK PELANGAI">SK PELANGAI</option>
          <option value="SMK SERI PELANGAI">SMK SERI PELANGAI</option>
          <option value="SK SIMPANG PELANGAI">SK SIMPANG PELANGAI</option>
          <option value="SJKC MANCHIS">SJKC MANCHIS</option>
          <option value="SK KG SHAFIE">SK KG SHAFIE</option>
          <option value="SMK TELEMONG">SMK TELEMONG</option>
          <option value="SJKC TELEMONG">SJKC TELEMONG</option>
          <option value="SJKT LADANG RENJOK">SJKT LADANG RENJOK</option>
          <option value="LAIN-LAIN">LAIN-LAIN (NYATAKAN DALAM TUJUAN)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">No. Telefon (WhatsApp):</label>
        <input type="tel" id="phone" required placeholder="Contoh: 019-1234567">
      </div>

      <div class="form-group">
        <label for="tarikh">Tarikh Tempahan:</label>
        <input type="date" id="tarikh" required>
      </div>

      <div class="form-group">
        <label for="masaMula">Masa Mula:</label>
        <input type="time" id="masaMula" required>
      </div>

      <div class="form-group">
        <label for="masaTamat">Masa Tamat:</label>
        <input type="time" id="masaTamat" required>
      </div>

      <div class="form-group">
        <label for="tujuan">Tujuan / Nama Program:</label>
        <textarea id="tujuan" rows="3" required placeholder="Nyatakan tujuan mesyuarat, bengkel, atau aktiviti..."></textarea>
      </div>

      <button type="submit" id="btnSubmit">HANTAR PERMOHONAN</button>
    </form>

    <div id="statusMessage"></div>
  </div>

</div>

<!-- POP-UP MODAL PRATONTON SLIP MESYUARAT -->
<div id="previewModal" class="preview-modal">
  <div class="preview-modal-content">
    <div id="previewModalContent"></div>
    <div class="preview-actions">
      <button type="button" onclick="triggerPrint()" class="btn-action-print">🖨️ Cetak / Save PDF</button>
      <button type="button" onclick="closePreviewModal()" class="btn-action-close">❌ Tutup Paparan</button>
    </div>
  </div>
</div>



<script>
  // MAKUMAT SUPABASE PROJEK PTIS PELANGAI
  const SUPABASE_URL = 'https://jvqpilyqybhyoromzgez.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2cXBpbHlxeWJoeW9yb216Z2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMDE1NzcsImV4cCI6MjEwMTg3NzU3N30.m1pcLzq2zfB5sI3EU0E8JGhixMS6SGhqO0q1gOO-ljI';
  
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// FUNGSI UTIS UNTUK FORMAT TARIKH DD/MM/YYYY
  function formatDateDDMMYYYY(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    return dateStr;
  }

  const form = document.getElementById('bookingForm');
  const statusMessage = document.getElementById('statusMessage');
  const btnSubmit = document.getElementById('btnSubmit');
  const jadualBody = document.getElementById('jadualBody');

  let allData = [];
  let currentPage = 1;
  const rowsPerPage = 3;

  // AMBIL DATA DARI SUPABASE (PANTAS)
  async function loadJadual() {
    try {
      const { data, error } = await _supabase
        .from('tempahan_mesyuarat')
        .select('*')
        .eq('status', 'DILULUSKAN')
        .order('tarikh', { ascending: true });

      if (error) throw error;

      allData = data || [];
      // TAMBAHAN: Paparkan status hari ini
      renderTodayStatus();
      
      if (allData.length === 0) {
        jadualBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Tiada tempahan direkodkan lagi.</td></tr>';
        document.getElementById('pageInfo').innerText = "Halaman 0 dari 0";
        return;
      }

      currentPage = 1;
      renderTable();
    } catch (err) {
      console.error(err);
      jadualBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuatkan jadual. Sila muat semula halaman.</td></tr>';
    }
  }

 function renderTable() {
    jadualBody.innerHTML = '';

    let start = (currentPage - 1) * rowsPerPage;
    let end = start + rowsPerPage;
    let paginatedItems = allData.slice(start, end);

    paginatedItems.forEach((item, index) => {
      const realIndex = start + index;
      const row = document.createElement('tr');
      
      let statusBadge = `<span class="badge-lulus">${item.status}</span>`;
      let printBtn = `<button type="button" class="btn-table-print" onclick="cetakRowData(${realIndex})">🖨️ Cetak</button>`;

      row.innerHTML = `
        <td><b>${formatDateDDMMYYYY(item.tarikh)}</b></td>
        <td>${item.masa_mula} - ${item.masa_tamat}</td>
        <td>${item.sekolah}</td>
        <td>${item.tujuan}</td>
        <td>
          <div class="status-cell">
            ${statusBadge}
            ${printBtn}
          </div>
        </td>
      `;
      jadualBody.appendChild(row);
    });

    let totalPages = Math.ceil(allData.length / rowsPerPage);
    document.getElementById('pageInfo').innerText = `Halaman ${currentPage} dari ${totalPages || 1}`;
    
    document.getElementById('btnPrev').disabled = (currentPage === 1);
    document.getElementById('btnNext').disabled = (currentPage === totalPages || totalPages === 0);
  }

  function prevPage() {
    if (currentPage > 1) {
      currentPage--;
      renderTable();
    }
  }

  function nextPage() {
    let totalPages = Math.ceil(allData.length / rowsPerPage);
    if (currentPage < totalPages) {
      currentPage++;
      renderTable();
    }
  }



  window.onload = loadJadual;

  // PROSES PERMOHONAN & SEMAKAN BERTINDIH AUTOMATIK
  form.addEventListener('submit', async e => {
    e.preventDefault();
    
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Sedang Menyemak Database...";
    statusMessage.style.color = "#333";
    statusMessage.innerText = "Menyemak kekosongan tarikh...";

    let tarikhInput = document.getElementById('tarikh').value;
    let masaMulaInput = document.getElementById('masaMula').value;
    let masaTamatInput = document.getElementById('masaTamat').value;

    try {
      // Semakan pertindihan tarikh terus pada pelayan Supabase
      const { data: existingBookings, error: checkErr } = await _supabase
        .from('tempahan_mesyuarat')
        .select('*')
        .eq('tarikh', tarikhInput)
        .eq('status', 'DILULUSKAN');

      if (checkErr) throw checkErr;

      if (existingBookings && existingBookings.length > 0) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "❌ TEMPAHAN GAGAL: Bilik Mesyuarat telah pun diluluskan kepada permohonan lain pada tarikh ini.";
        btnSubmit.disabled = false;
        btnSubmit.innerText = "HANTAR PERMOHONAN";
        return;
      }

      // Simpan ke Supabase
      const { error: insertErr } = await _supabase
        .from('tempahan_mesyuarat')
        .insert([{
          nama: document.getElementById('nama').value,
          sekolah: document.getElementById('sekolah').value,
          phone: document.getElementById('phone').value,
          tarikh: tarikhInput,
          masa_mula: masaMulaInput,
          masa_tamat: masaTamatInput,
          tujuan: document.getElementById('tujuan').value,
          status: 'DILULUSKAN'
        }]);

      if (insertErr) throw insertErr;

      statusMessage.style.color = "green";
      statusMessage.innerText = "✅ Permohonan DILULUSKAN! Data telah dikemaskini pada jadual.";
      form.reset();
      loadJadual();

    } catch (err) {
      console.error(err);
      statusMessage.style.color = "red";
      statusMessage.innerText = "❌ Ralat sistem: " + err.message;
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "HANTAR PERMOHONAN";
    }
  });

// Tarikh rujukan kalendar
  let currentCalDate = new Date();

  function getTodayString() {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const d = String(today.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

// KEMASKINI STATUS KAD HARI INI
  function renderTodayStatus() {
    const todayStr = getTodayString();
    const todayBox = document.getElementById('todayStatusBox');
    const statusText = document.getElementById('todayStatusText');
    const dateLabel = document.getElementById('todayDateLabel');

    if (dateLabel) {
      dateLabel.innerText = `Hari Ini: ${formatDateDDMMYYYY(todayStr)}`;
    }

    const todayBookings = allData.filter(item => item.tarikh === todayStr);

    if (todayBookings.length > 0) {
      todayBox.classList.add('occupied');
      const b = todayBookings[0];
      // Hanya nama sekolah dan masa sahaja dipaparkan
      statusText.innerHTML = `🔴 <b>DITEMPAH HARI INI:</b> ${b.sekolah} (${b.masa_mula} - ${b.masa_tamat})`;
    } else {
      todayBox.classList.remove('occupied');
      statusText.innerHTML = `🟢 <b>TIADA TEMPAHAN HARI INI</b> — Bilik mesyuarat sedia digunakan / tiada sebarang program.`;
    }
  }

  // FUNGSI MODAL KALENDAR
  function openCalendarModal() {
    document.getElementById('calendarModal').style.display = 'block';
    document.body.style.overflow = 'hidden';
    renderCalendar();
  }

  function closeCalendarModal() {
    document.getElementById('calendarModal').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  function prevMonth() {
    currentCalDate.setMonth(currentCalDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentCalDate.setMonth(currentCalDate.getMonth() + 1);
    renderCalendar();
  }

 function renderCalendar() {
    const calGrid = document.getElementById('calendarGrid');
    calGrid.innerHTML = '';

    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();

    const monthNames = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
    document.getElementById('calMonthTitle').innerText = `${monthNames[month]} ${year}`;

    const days = ['Ahad', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'];
    days.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-col-name';
      el.innerText = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    const todayStr = getTodayString();

    // Kotak kosong awal bulan
    for (let i = 0; i < firstDay; i++) {
      const emptyEl = document.createElement('div');
      emptyEl.className = 'cal-cell';
      emptyEl.style.border = 'none';
      emptyEl.style.background = 'transparent';
      calGrid.appendChild(emptyEl);
    }

    // Kotak setiap hari
    for (let d = 1; d <= totalDays; d++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';

      const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (dStr === todayStr) {
        cell.classList.add('today');
      }

      cell.innerHTML = `<strong>${d}</strong>`;

      // Semak sama ada tarikh ini ada tempahan
      const matches = allData.filter(b => b.tarikh === dStr);
      if (matches.length > 0) {
        cell.classList.add('has-booking');
        cell.title = "Klik untuk lihat maklumat tempahan";
        
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        cell.appendChild(dot);

        // Fungsi bila kotak tarikh diklik
        cell.onclick = () => showBookingDetails(dStr, matches);
      }

      calGrid.appendChild(cell);
    }
  }

// FUNGSI PAPAR MAKLUMAT TEMPAHAN BILA KOTAK MERAH DIKLIK (BERSIH)
  function showBookingDetails(dateStr, bookings) {
    let msg = `📅 TARIKH: ${formatDateDDMMYYYY(dateStr)}\n`;
    msg += `------------------------------------\n`;
    bookings.forEach((b) => {
      msg += `🏫 Sekolah: ${b.sekolah}\n`;
      msg += `⏰ Masa: ${b.masa_mula} - ${b.masa_tamat}\n`;
      msg += `📌 Tujuan: ${b.tujuan}\n`;
      msg += `👤 Pemohon: ${b.nama || '-'}\n`;
      msg += `------------------------------------\n`;
    });
    alert(msg);
  }
